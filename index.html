<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планувальник подій — ТВР ЛБ1 Варіант 17</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Планувальник подій</h1>
    <p>ТВР ЛБ1 · Варіант 17 · Чекавий Р.С. (КІУКІ-23-7)</p>
  </header>

  <main>

    <!-- ФОРМА ДОДАВАННЯ / РЕДАГУВАННЯ -->
    <section class="form-section">
      <h2 id="form-title">Додати подію</h2>

      <form id="event-form" novalidate>

        <div class="form-group">
          <label for="inp-title">Назва *</label>
          <input type="text" id="inp-title" placeholder="напр. Захист лабораторної роботи">
          <span class="error" id="err-title"></span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inp-date">Дата *</label>
            <input type="date" id="inp-date">
            <span class="error" id="err-date"></span>
          </div>
          <div class="form-group">
            <label for="inp-time">Час *</label>
            <input type="time" id="inp-time">
            <span class="error" id="err-time"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inp-type">Тип *</label>
            <select id="inp-type">
              <option value="study">Навчання</option>
              <option value="work">Робота</option>
              <option value="personal">Особисте</option>
              <option value="leisure">Відпочинок</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inp-location">Місце *</label>
            <input type="text" id="inp-location" placeholder="напр. ХНУРЕ, ауд. 312">
            <span class="error" id="err-location"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="inp-desc">Опис</label>
          <textarea id="inp-desc" rows="3" placeholder="Нотатки до події..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-submit">Створити подію</button>
          <button type="button" id="btn-cancel" style="display:none">Скасувати</button>
        </div>

      </form>
    </section>

    <!-- СПИСОК ПОДІЙ -->
    <section class="list-section">

      <!-- Пошук та фільтри -->
      <div class="controls">
        <input type="search" id="inp-search" placeholder="Пошук за назвою або місцем...">
        <select id="sel-type">
          <option value="all">Усі типи</option>
          <option value="study">Навчання</option>
          <option value="work">Робота</option>
          <option value="personal">Особисте</option>
          <option value="leisure">Відпочинок</option>
        </select>
        <select id="sel-sort">
          <option value="date-asc">Спочатку найближчі</option>
          <option value="date-desc">Спочатку пізніші</option>
          <option value="title-asc">За назвою (А→Я)</option>
        </select>
      </div>

      <!-- Контейнер для карток (порожній — наповнюється через JS) -->
      <div id="events-list"></div>

    </section>

  </main>

  <footer>
    <p>Кафедра АПОТ, ХНУРЕ · «Технології веб-розробки» 2026/2027</p>
  </footer>

  <!-- Toast-сповіщення -->
  <div id="toast-container"></div>

  <script src="models.js" defer></script>
  <script src="app.js" defer></script>

</body>
</html>
