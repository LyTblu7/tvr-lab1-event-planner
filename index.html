<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планувальник подій · ТВР ЛБ1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>📅 Планувальник подій</h1>
    <span>ТВР ЛБ1 · Варіант 17 · Чекавий Р.С. (КІУКІ-23-7)</span>
  </header>

  <div class="layout">

    <!-- ── ФОРМА (ліворуч, sticky) ── -->
    <aside class="sidebar">
      <h2 id="form-title">Додати подію</h2>

      <form id="event-form" novalidate>

        <div class="field">
          <label for="f-title">Назва *</label>
          <input id="f-title" type="text" placeholder="напр. Захист ЛБ1 з ТВР">
          <span class="err" id="e-title"></span>
        </div>

        <div class="row2">
          <div class="field">
            <label for="f-date">Дата *</label>
            <input id="f-date" type="date">
            <span class="err" id="e-date"></span>
          </div>
          <div class="field">
            <label for="f-time">Час *</label>
            <input id="f-time" type="time">
            <span class="err" id="e-time"></span>
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="f-type">Тип *</label>
            <select id="f-type">
              <option value="study">📚 Навчання</option>
              <option value="work">💼 Робота</option>
              <option value="personal">🙂 Особисте</option>
              <option value="leisure">🎉 Відпочинок</option>
            </select>
          </div>
          <div class="field">
            <label for="f-location">Місце *</label>
            <input id="f-location" type="text" placeholder="напр. ХНУРЕ, ауд. 312">
            <span class="err" id="e-location"></span>
          </div>
        </div>

        <div class="field">
          <label for="f-desc">Опис</label>
          <textarea id="f-desc" rows="3" placeholder="Нотатки…"></textarea>
        </div>

        <div class="form-btns">
          <button type="submit" id="btn-submit">Створити подію</button>
          <button type="button" id="btn-cancel" class="btn-sec" hidden>Скасувати</button>
        </div>

      </form>
    </aside>

    <!-- ── СПИСОК ПОДІЙ (праворуч) ── -->
    <main class="content">

      <div class="toolbar">
        <input id="inp-search" type="search" placeholder="🔍 Пошук за назвою або місцем…">
        <select id="sel-type">
          <option value="all">Усі типи</option>
          <option value="study">📚 Навчання</option>
          <option value="work">💼 Робота</option>
          <option value="personal">🙂 Особисте</option>
          <option value="leisure">🎉 Відпочинок</option>
        </select>
        <select id="sel-sort">
          <option value="date-asc">Спочатку найближчі</option>
          <option value="date-desc">Спочатку пізніші</option>
          <option value="title-asc">За назвою (А→Я)</option>
        </select>
      </div>

      <!-- Картки генеруються JS-ом (Крок 7 методички) -->
      <div id="events-list" class="events-grid"></div>

    </main>

  </div>

  <footer>Кафедра АПОТ · ХНУРЕ · «Технології веб-розробки» 2026/2027</footer>

  <!-- Toast-сповіщення (Варіант 17) -->
  <div id="toasts"></div>

  <script src="models.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
